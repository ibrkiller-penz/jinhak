name: 2027 수시 교대 경쟁률 20:10 정기 자동 수집

on:
  schedule:
    # 매일 20:10 KST (11:10 UTC)
    - cron: '10 11 * * *'
  workflow_dispatch:
    inputs:
      label:
        description: '수집 회차 라벨 (미입력 시 현재 시각 기준 자동 산출)'
        required: false
        default: ''

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.10 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 의존성 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r collector/requirements.txt

      - name: Playwright 브라우저 및 시스템 의존성 설치
        run: |
          python -m playwright install --with-deps chromium

      - name: 8개 교대 실시간 경쟁률 수집 및 Drive/Firestore 전송
        env:
          GAS_WEBHOOK_URL: 'https://script.google.com/macros/s/AKfycbwo_6L7Fkjg_iv7LgsI9BB6EYY2Gz0yK0B7dnG9DxfP5yECtA1pboX3mud77YQG9BaHbg/exec'
          GDRIVE_ROOT_FOLDER_ID: '1WmHB5_EqiZklq6kRnMXDn_kfbNXAD61j'
          TZ: 'Asia/Seoul'
        run: |
          LABEL_ARG=""
          if [ -n "${{ github.event.inputs.label }}" ]; then
            LABEL_ARG="--label ${{ github.event.inputs.label }}"
          fi
          python collector/main.py --auto $LABEL_ARG

      - name: 수집 결과물(스냅샷/엑셀) 아티팩트 보존
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gyodae-captures-and-backdata-${{ github.run_id }}
          path: |
            out/captures/
            out/backdata/
            out/reports/
          retention-days: 30